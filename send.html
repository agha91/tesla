<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>إرسال وجهة للسيارة</title>
<style>
  :root { --bg: #f4f6fa; --card: #fff; --ink: #14213d; --mut: #667085; --pri: #2f7bff; --ok: #12805c; --err: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1424; --card: #18223a; --ink: #eef2fb; --mut: #98a2b3; --ok: #4ade80; --err: #ff8a80; } }
  * { box-sizing: border-box; } html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.12); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent; border: 1.5px solid var(--mut); border-radius: 12px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; background: var(--pri); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; }
  #st { min-height: 1.5em; margin: 8px 2px; font-weight: 600; } #st.ok { color: var(--ok); } #st.err { color: var(--err); }
  .res { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(128,128,128,.25); } .res:first-child { border-top: 0; }
  .res .t { flex: 1; min-width: 0; } .res b { display: block; } .res small { color: var(--mut); }
  .hint { color: var(--mut); font-size: 14px; }
</style>
</head>
<body>
<h1>أرسل وجهة إلى السيارة</h1>
<div class="card">
  <div class="row"><input id="q" type="search" placeholder="اسم مكان، أو الصق رابط خرائط جوجل" autocomplete="off" enterkeyhint="search"><button id="go" type="button">بحث</button></div>
  <div class="hint" style="margin-top:8px">يمكنك أيضاً لصق رابط «مشاركة» من خرائط جوجل، أو إحداثيات مثل 33.31, 44.36</div>
</div>
<div id="st"></div>
<div id="out" class="card" style="display:none"></div>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var CFG = window.MAP_CFG || {}, INBOX = String(CFG.inbox || '').replace(/\/+$/, ''), SEARCH = CFG.search || 'https://nominatim.openstreetmap.org/search';
  var code = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
  var okCode = /^[a-z0-9]{8,24}$/.test(code), where = null;
  function st(t, c) { var e = $('st'); e.textContent = t || ''; e.className = c || ''; }
  if (!okCode) { st('امسح رمز QR من شاشة السيارة ليتم الربط.', 'err'); $('go').disabled = true; }
  else if (!INBOX) { st('خدمة الإرسال غير مفعّلة بعد (inbox في config.js).', 'err'); $('go').disabled = true; }
  try { navigator.geolocation && navigator.geolocation.getCurrentPosition(function (p) { where = { lat: p.coords.latitude, lon: p.coords.longitude }; }, function () {}, { maximumAge: 600000, timeout: 8000 }); } catch (e) {}
  function hav(a, b, c, d) { var r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2); return 12742e3 * Math.asin(Math.sqrt(x * x + Math.cos(a * r) * Math.cos(c * r) * y * y)); }
  function coordsIn(s) {                                                  // the place coordinates inside a maps link or plain text
    var m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/[?&](?:q|ll|query|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,،\s]\s*(-?\d{1,3}\.\d+)\s*$/);
    return m ? { lat: +m[1], lon: +m[2] } : null;
  }
  function nameIn(s) { var m = s.match(/\/place\/([^\/@?]+)/) || s.match(/[?&]q=([^&]+)/); try { return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; } catch (e) { return ''; } }
  function send(lat, lon, name, btn) {
    if (btn) btn.disabled = true; st('جارٍ الإرسال…');
    fetch(INBOX + '/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ c: code, lat: lat, lon: lon, name: name || '' }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { if (!x.ok) throw new Error(x.j && x.j.error === 'range' ? 'الموقع خارج العراق' : 'رفض الخادم الطلب'); st('✓ أُرسلت الوجهة إلى السيارة: ' + (name || ''), 'ok'); })
      .catch(function (e) { st('تعذّر الإرسال: ' + (e.message || 'تحقق من الاتصال'), 'err'); if (btn) btn.disabled = false; });
  }
  function show(list) {
    var o = $('out'); o.innerHTML = ''; o.style.display = list.length ? 'block' : 'none';
    list.forEach(function (p) {
      var r = document.createElement('div'); r.className = 'res';
      var t = document.createElement('div'); t.className = 't'; var b = document.createElement('b'); b.textContent = p.name; var s = document.createElement('small'); s.textContent = p.sub || ''; t.appendChild(b); t.appendChild(s);
      var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = 'أرسل'; bt.onclick = function () { send(p.lat, p.lon, p.name, bt); };
      r.appendChild(t); r.appendChild(bt); o.appendChild(r);
    });
  }
  function search(q) {
    st('جارٍ البحث…');
    var url = SEARCH + '?format=jsonv2&limit=8&countrycodes=iq&accept-language=ar&q=' + encodeURIComponent(q);
    fetch(url).then(function (r) { return r.json(); }).then(function (a) {
      var l = (a || []).map(function (x) { var n = x.name || String(x.display_name || '').split(',')[0]; return { lat: +x.lat, lon: +x.lon, name: n || q, sub: String(x.display_name || '').split(',').slice(1, 3).join('،').trim() }; });
      if (where) l.sort(function (a, b) { return hav(where.lat, where.lon, a.lat, a.lon) - hav(where.lat, where.lon, b.lat, b.lon); });
      show(l); st(l.length ? 'اختر الوجهة ثم اضغط «أرسل».' : 'لا نتائج. جرّب اسماً آخر.', l.length ? '' : 'err');
    }).catch(function () { st('تعذّر البحث. تحقق من الاتصال.', 'err'); });
  }
  function handle(q) {
    q = q.trim(); if (!q) return; show([]);
    var c = coordsIn(q);
    if (c) { send(c.lat, c.lon, nameIn(q) || 'موقع من الجوال'); return; }
    var um = q.match(/https?:\/\/\S+/i);                                // a shared message: "name + link"
    if (um) {
      var link = um[0].replace(/[)\]}>.,،]+$/, ''), pre = q.replace(um[0], '').replace(/\s+/g, ' ').trim();
      var c1 = coordsIn(link); if (c1) { send(c1.lat, c1.lon, nameIn(link) || pre || 'موقع من الجوال'); return; }
      st('جارٍ قراءة الرابط…');
      fetch(INBOX + '/resolve?u=' + encodeURIComponent(link)).then(function (r) { return r.json(); }).then(function (j) {
        var full = (j && j.url) || link, c2 = (j && j.lat != null && j.lon != null) ? { lat: +j.lat, lon: +j.lon } : coordsIn(full);
        var nm = nameIn(full) || (j && j.title && !/^Google/i.test(j.title) ? String(j.title).replace(/\s*[-–·].*Google.*$/i, '') : '') || pre;
        if (c2) send(c2.lat, c2.lon, nm || 'موقع من الجوال');
        else if (nm) { $('q').value = nm; search(nm); }
        else st('لم أجد موقعاً داخل الرابط. اكتب اسم المكان.', 'err');
      }).catch(function () { if (pre) { $('q').value = pre; search(pre); } else st('تعذّر قراءة الرابط. اكتب اسم المكان.', 'err'); });
      return;
    }
    search(q);
  }
  $('go').onclick = function () { handle($('q').value); };
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') handle($('q').value); });
})();
</script>
</body>
</html>
